<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Jogo dos Cofres</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='./styles/style.css'>
</head>
<body>
    <h1>Jogo dos Cofres</h1>
    <h3>Para jogar, voce tem que escolher um dos cofres, só um deles vai conter o premio!
        A cada rodada um cofre será escolhido, voce tem tentativas infinitas! </h3>
    
    
    <div class="arena" id="arena">
        <button id="cofre1">Cofre 1 🔢</button>
        <button id="cofre2">Cofre 2 🔒</button>
        <button id="cofre3">Cofre 3 🪙</button>
    </div>

    <h2 id="mensagem">Escolha um cofre.</h2>
    <h2 id="tentativas">Tentativas: </h2>
    <h2 id="vitorias">Vitórias: </h2>

    <button id="jogar-novamente">Jogar Novamente</button>

 
    <h2 id="mensagem"></h2>
        <script src='./js/index.js'></script>

</body>
</html>
